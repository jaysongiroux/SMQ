version: "2.1"

run:
  timeout: 5m
  go: "1.23"

linters:
  exclusions:
    rules:
      - path: (.+)_test.go
        linters:
          - errcheck
          - gosec

  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - dupl
    - errorlint
    - iface
    - gosec
